name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ==================================================
  # BASE: the app as most people install it
  # ==================================================
  test:
    name: tests (core deps, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Without this a hung apt mirror keeps a runner for six hours (the
    # GitHub default) and the PR just sits there looking busy. The whole
    # job takes well under a minute when the network behaves.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Oldest version the type hints allow, plus the version used
        # for local development.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No apt step: requirements.txt asks for opencv-python-headless,
      # which has no GUI libraries to link against. This job used to
      # spend 25 seconds on `apt-get update` on a good day and hang for
      # 20 minutes on a bad one, before running a test suite that takes
      # 15 seconds.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # -rs lists what was skipped, so "the ML tests were skipped
      # because the packages aren't here" is visible in the log rather
      # than looking like they passed.
      #
      # Coverage is reported, not enforced. A threshold here would
      # mostly measure how much of the Streamlit view layer a headless
      # runner happens to execute; the number is useful to look at and
      # a poor thing to fail a build on.
      - name: Run tests
        run: pytest -q -rs --cov=modules --cov=views --cov-report=term-missing

  # ==================================================
  # OPTIONAL ML: the deep-learning stages, for real
  # ==================================================
  #
  # Without this job the YOLO and MediaPipe code paths are never
  # executed with the actual packages installed — the base job only
  # ever covers the "not installed, show an install hint" branch, and
  # a broken model call would ship green.
  #
  # One Python version rather than the full matrix: this installs
  # PyTorch, so it is by far the most expensive job here, and the point
  # is to cover the code path at all, not to cover it twice.
  test-ml:
    name: tests (optional ML deps)
    runs-on: ubuntu-latest
    # Longer than the others: this one downloads PyTorch.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Still needed here, unlike the core job: mediapipe depends on
      # opencv-contrib-python, which is the GUI build, and its own
      # native library wants the OpenGL ES runtime.
      #
      # The runners ship with apt's package lists already populated, so
      # try the install first and only reach for a mirror if that
      # fails — `apt-get update` is the part that hangs.
      - name: Install MediaPipe system libraries
        timeout-minutes: 6
        run: |
          install_them() {
            sudo apt-get install -y libgl1 libegl1 libgles2 \
              && { sudo apt-get install -y libglib2.0-0t64 \
                   || sudo apt-get install -y libglib2.0-0; }
          }
          install_them || { sudo apt-get update && install_them; }

      # The default PyTorch wheels bundle CUDA and are several GB. The
      # runners have no GPU, so the CPU-only index gives the same test
      # coverage in a fraction of the download.
      #
      # It is a separate index rather than PyPI, so it is also a
      # separate thing that can be down. Falling back to PyPI keeps an
      # outage there from reading as "the ML stages are broken" — the
      # job just gets slower.
      - name: Install PyTorch (CPU-only build)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu \
            || pip install torch torchvision

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
                      -r requirements-dev.txt \
                      -r requirements-ml.txt

      # Fetching the weights as an explicit step means a model-hosting
      # outage shows up here, as an obviously infrastructural failure,
      # instead of as a confusing assertion error inside a test.
      - name: Fetch model weights
        env:
          # ultralytics writes its settings file to $HOME by default,
          # which it warns about on read-only runners.
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: python scripts/fetch_models.py

      - name: Run tests
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: pytest -q -rs

  # ==================================================
  # A DELIBERATELY BROKEN ENVIRONMENT
  # ==================================================
  #
  # Both of this project's production breakages were environmental —
  # a package resolving to OpenCV 5, and MediaPipe installed on a
  # machine with no OpenGL ES runtime — and both shipped green,
  # because in a *working* environment there is nothing to detect.
  #
  # So this job builds the broken environment on purpose: the ML
  # packages installed, the OpenGL libraries left out. It doesn't
  # assert that everything works. It asserts that the app says what is
  # missing and keeps its other 32 stages running, which is the actual
  # requirement.
  test-degraded:
    name: tests (ML deps, no system libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # libgl1 and glib only, for the GUI build of OpenCV that
      # mediapipe drags in. libegl1 and libgles2 are pointedly absent —
      # that absence is what this job exists to test.
      - name: Install the bare minimum
        timeout-minutes: 6
        run: |
          install_them() {
            sudo apt-get install -y libgl1 \
              && { sudo apt-get install -y libglib2.0-0t64 \
                   || sudo apt-get install -y libglib2.0-0; }
          }
          install_them || { sudo apt-get update && install_them; }

      - name: Install PyTorch (CPU-only build)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu \
            || pip install torch torchvision

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
                      -r requirements-dev.txt \
                      -r requirements-ml.txt

      - name: The app must degrade, not fall over
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: pytest -q -rs tests/test_graceful_degradation.py

  # ==================================================
  # LINT
  # ==================================================
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint only, not `ruff format --check`. The formatter has its own
      # opinion about blank lines that would reflow most of this
      # codebase in a single commit and flatten the spacing the modules
      # use to separate one step of an operation from the next.
      - name: Lint
        run: ruff check .
